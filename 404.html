<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA Redirect
    // Preserve the path and reload index.html with it encoded as query string
    var redirectTo = '/index.html?redirect=' + encodeURIComponent(location.pathname);
    window.location.replace(redirectTo);
  </script>
</head>
<body></body>
</html>
