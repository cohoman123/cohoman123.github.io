<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Companies House — Overview (Dark)</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    /* ---------- Light (default) ---------- */
    :root {
      --ink:#111; --muted:#666; --bg:#f7f7fb; --card:#fff; --accent:#0b5fff; --warn:#b00020;
      --border:#e6e6e6; --thead:#fafafa; --shadow:0 1px 3px rgba(0,0,0,.08);
      --tab-bg:#efefef; --tab-ink:#111; --tab-active-bg:#fff; --tab-active-border:#025f2a;
      --pill-bg:#eef3ff; --pill-ink:#1c3faa;
    }
    /* ---------- Dark ---------- */
    [data-theme="dark"] {
      --ink:#e6edf3; --muted:#9da7b3; --bg:#0d1117; --card:#161b22; --accent:#2f81f7; --warn:#ff6b6b;
      --border:#2a2f37; --thead:#1b212a; --shadow:none;
      --tab-bg:#1a222d; --tab-ink:#cfd8e3; --tab-active-bg:#161b22; --tab-active-border:#25a36f;
      --pill-bg:#243b63; --pill-ink:#cfe0ff;
    }

    /* ---------- Base ---------- */
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    main { padding:24px 18px 96px; max-width:1100px; margin:auto; }
    .panel { background:var(--card); border-radius:10px; box-shadow:var(--shadow); border:1px solid var(--border); }
    .panel .body { padding:16px; }
    .rows { display:grid; gap:12px; }
    .kv { display:grid; grid-template-columns: 260px 1fr; gap:10px; }
    .muted { color:var(--muted); }
    .err { color:var(--warn); font-weight:600; }
    .pill { font-size:12px; background:var(--pill-bg); color:var(--pill-ink); padding:2px 8px; border-radius:999px; display:inline-block; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* ---------- Page header (CH-like) ---------- */
    .ch-header { margin-top:8px; }
    .ch-title { font-size:32px; font-weight:800; margin:0 0 6px 0; }
    .ch-number { margin:0 0 12px; font-size:16px; }
    .action-bar { display:flex; gap:8px; margin:12px 0 18px; flex-wrap:wrap; }
    .btn { background:#1f7a40; color:#fff; border:none; padding:10px 14px; border-radius:6px; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#4a4f57; }
    [data-theme="dark"] .btn.secondary { background:#303a46; }

    /* ---------- Tabs (visual only; Overview active) ---------- */
    .tabs { display:flex; gap:8px; border-bottom:1px solid var(--border); margin:18px 0 0; }
    .tab {
      background:var(--tab-bg); color:var(--tab-ink);
      padding:8px 12px; border-radius:6px 6px 0 0; border:1px solid var(--border);
      border-bottom:none; text-decoration:none; display:inline-block; font-weight:700;
    }
    .tab[aria-current="page"] {
      background:var(--tab-active-bg); border-color:var(--border); border-bottom:2px solid var(--tab-active-border);
    }
    .tab.disabled { opacity:.7; cursor:not-allowed; }

    /* ---------- Footer (API key actions) ---------- */
    .key-footer {
      position:fixed; left:0; right:0; bottom:0; padding:8px 12px;
      display:flex; gap:8px; align-items:center; justify-content:flex-end;
      background:var(--card); border-top:1px solid var(--border);
    }
    .key-footer .muted { margin-right:auto; }
    button { background:var(--accent); color:#fff; border:none; padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer; }
    button[disabled] { opacity:.6; cursor:progress; }
    .secondary { background:#555; }
    [data-theme="dark"] .secondary { background:#303a46; }
    .danger { background:var(--warn); }

    /* ---------- Small bits ---------- */
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #ddd; border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-left:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .right { margin-left:auto; }

  </style>
</head>
<body>
  <main>
    <!-- CH-style page head -->
    <section class="ch-header">
      <h1 id="companyName" class="ch-title">—</h1>
      <p id="companyNumberLine" class="ch-number muted">Company number —</p>
      <div class="action-bar">
        <button class="btn secondary" id="themeToggleBtn" type="button" title="Toggle theme via URL">Toggle dark</button>
        #Open on Companies House ↗</a>
      </div>

      <!-- Tabs: Overview active; others link to official pages -->
      <nav class="tabs" aria-label="Company sections">
        #Overview</a>
        <a class="tab" id="filingTab" target="_blank" rel="noreferrer noopener">Filing history</a>
        <a class="tab" id="peopleTab" target="_blank" rel="noreferrer noopener">People</a>
        <a class="tab" id="moreTab" target="_blank" rel="noreferrer noopener">More</a>
      </nav>
    </section>

    <!-- Overview only -->
    <section class="panel" id="overviewPanel" style="margin-top:0;">
      <div class="body" id="overviewBody">
        <span class="muted">Awaiting company number from URL…</span>
      </div>
    </section>

    <!-- Inline error -->
    <p id="error" class="err"></p>
  </main>

  <!-- API key footer -->
  <footer class="key-footer">
    <span id="keyStatus" class="muted">No API key saved.</span>
    <button id="setKeyBtn" class="secondary" type="button" title="Set API key">Set API key…</button>
    <button id="clearKeyBtn" class="danger" type="button" title="Clear API key">Clear</button>
  </footer>

  <script>
    /** *********************
     * CONFIG
     * **********************/
    const API_BASE = 'https://api.company-information.service.gov.uk';
    const STORAGE_KEY = 'ch_api_key';

    /** *********************
     * Helpers
     * **********************/
    const q = sel => document.querySelector(sel);
    const showErr = msg => q('#error').textContent = msg || '';

    const getKey = () => localStorage.getItem(STORAGE_KEY) || '';
    const setKey = (key) => localStorage.setItem(STORAGE_KEY, key);
    const clearKey = () => localStorage.removeItem(STORAGE_KEY);
    function refreshKeyUI() {
      const has = !!getKey();
      q('#keyStatus').textContent = has ? 'API key saved in this browser.' : 'No API key saved.';
    }

    function kv(label, value, fallback='—') {
      const safe = (value===undefined || value===null || value==='') ? fallback : value;
      return `<div class="kv"><div class="muted">${label}</div><div>${safe}</div></div>`;
    }
    function humanizeType(s) {
      if (!s) return '—';
      return s.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    }
    function formatCompanyAddress(addr) {
      if (!addr) return '—';
      return [addr.premises, addr.address_line_1, addr.address_line_2, addr.locality, addr.region, addr.postal_code, addr.country]
        .filter(Boolean).join(', ');
    }

    /** Theme control from URL: /{number}/dark|light|auto? */
    function parseRoute() {
      const parts = location.pathname.replace(/^\/+/, '').split('/').filter(Boolean);
      const number = parts[0] || '';
      const mode = (parts[1] || '').toLowerCase();
      const theme = mode === 'dark' ? 'dark' : (mode === 'light' ? 'light' : 'auto');
      return { number, theme };
    }
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    }
    function nextTheme(theme) {
      return theme === 'dark' ? 'light' : (theme === 'light' ? 'auto' : 'dark');
    }
    function setThemeViaUrl(newTheme) {
      const { number } = parseRoute();
      const path = `/${encodeURIComponent(number || '')}/${newTheme}`;
      history.pushState({ number, theme: newTheme }, '', path);
      applyTheme(newTheme);
    }

    /** API call using runtime key */
    async function chGet(path) {
      const key = getKey();
      if (!key) throw new Error('No API key set. Click “Set API key…” in the footer and enter your Companies House REST API key.');
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { 'Authorization': 'Basic ' + btoa(key + ':') }
      });
      if (!res.ok) {
        const text = await res.text().catch(()=> '');
        throw new Error(`${res.status} ${res.statusText} – ${text}`);
      }
      return res.json();
    }

    /** Render Overview only */
    async function loadOverviewFromUrl() {
      showErr('');
      const { number, theme } = parseRoute();
      applyTheme(theme);

      if (!number) {
        q('#overviewBody').innerHTML = '<span class="muted">Add a company number to the URL (e.g. /01234567/dark).</span>';
        q('#companyName').textContent = 'Companies House — Overview';
        q('#companyNumberLine').textContent = 'Company number —';
        document.title = 'Companies House — Overview';
        return;
      }

      try {
        q('#overviewBody').innerHTML = 'Loading<span class="spinner"></span>';
        const encoded = encodeURIComponent(number);
        const profile = await chGet(`/company/${encoded}`);

        // Header
        q('#companyName').textContent = profile.company_name || '—';
        q('#companyNumberLine').innerHTML = `Company number <strong class="mono">${profile.company_number || number}</strong>`;
        document.title = `${profile.company_name || number} — Overview`;

        // Tabs (external CH links for non-overview)
        const chBase = `https://find-and-update.company-information.service.gov.uk/company/${encodeURIComponent(profile.company_number || number)}`;
        q('#chOpenBtn').href = chBase;
        q('#filingTab').href = `${chBase}/filing-history`;
        q('#peopleTab').href = `${chBase}/officers`;
        q('#moreTab').href = `${chBase}`;

        // Overview body (selected key fields)
        q('#overviewBody').innerHTML = `
          <div class="rows">
            ${kv('Registered office address', formatCompanyAddress(profile.registered_office_address))}
            ${kv('Company status', `<span class="pill">${humanizeType(profile.company_status) || '—'}</span>`)}
            ${kv('Company type', humanizeType(profile.type))}
            ${kv('Incorporated on', profile.date_of_creation || '—')}
            ${kv('Jurisdiction', humanizeType(profile.jurisdiction))}
            ${kv('Nature of business (SIC)', (profile.sic_codes || []).join(', ') || '—')}
            ${kv('Has insolvency history?', String(profile.has_insolvency_history))}
            ${kv('Registered office is in', profile.registered_office_is_in_dispute ? 'DISPUTE' : 'Good standing')}
            ${kv('Companies House page', `${chBase}${chBase}</a>`)}
          </div>
        `;
      } catch (err) {
        console.error(err);
        const msg = String(err.message || '');
        if (msg.includes('401')) showErr('Auth failed. Check your API key (and that this origin is allowed in Companies House “JavaScript domains”).');
        else if (msg.includes('404')) showErr('Company not found. Check the number in the URL.');
        else if (msg.includes('CORS')) showErr('CORS blocked. Host this via GitHub Pages/Netlify/Vercel and add your origin in JavaScript domains.');
        else showErr(msg);
        q('#overviewBody').innerHTML = '<span class="muted">No data.</span>';
      }
    }

    /** Wire up footer actions and theme toggle */
    q('#setKeyBtn').addEventListener('click', () => {
      const current = getKey();
      const entered = prompt('Enter your Companies House REST API key:', current || '');
      if (entered !== null) {
        const trimmed = entered.trim();
        if (trimmed) setKey(trimmed); else clearKey();
        refreshKeyUI();
      }
    });
    q('#clearKeyBtn').addEventListener('click', () => { clearKey(); refreshKeyUI(); });

    q('#themeToggleBtn').addEventListener('click', () => {
      const cur = parseRoute().theme;
      const next = nextTheme(cur);
      setThemeViaUrl(next);
      q('#themeToggleBtn').textContent = next === 'dark' ? 'Toggle dark (now dark)' : (next === 'light' ? 'Toggle dark (now light)' : 'Toggle dark (now auto)');
    });

    // Handle browser nav
    window.addEventListener('popstate', () => loadOverviewFromUrl());

    // Init
    refreshKeyUI();
    loadOverviewFromUrl();
  </script>
</body>
</html>
