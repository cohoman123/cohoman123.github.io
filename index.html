
<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Companies House — Overview</title>

  <style>
    /* ========= Compact styling with borders ========= */
    :root {
      color-scheme: light dark;
      --bg: #f3f2f1;
      --panel-bg: #fff;
      --text: #111;
      --muted: #666;
      --border: #d9d9d9;
      --tab-bg: #ececec;
      --tab-active: #fff;
      --accent: #0a7f46;
    }
    [data-theme="dark"] :root,
    [data-theme="dark"] {
      --bg:#0b0c0c;
      --panel-bg:#1a1d1e;
      --text:#f2f2f2;
      --muted:#bdbdbd;
      --border:#2b2b2b;
      --tab-bg:#2a2f31;
      --tab-active:#2f84c7;
      --accent:#4fd08c;
    }

    html {
      padding: 6px;
      background:var(--tab-bg);
    }

    body { 
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
      background: var(--bg);}
    main { max-width:1100px; margin:auto; }
    
    h3 { display: inline }

    .tabs {
      display:flex;
      border-bottom:1px solid var(--border);
      background:var(--tab-bg);
      position:sticky;
      top:0;
      z-index:10;
      gap: 5px;
    }
    .tab {
      padding:6px 10px;
      background:var(--tab-bg);
      text-decoration:none;
      font-weight:700;
      color:var(--text);
      border:1px solid var(--border);
      border-bottom:none;
      cursor:pointer;
      user-select:none;
    }
    .tab[aria-current="page"] {
      background:var(--tab-active);
      border-bottom:2px solid var(--accent);
    }

    .panel {
      background:var(--panel-bg);
      border-radius:8px;
    }

    .kv { 
      display: block;
      padding:8px 0; 
      border-bottom:1px solid var(--border);
    }
    .kv:last-child { border-bottom:none; }

    .muted { color:var(--muted); display: inline;}

    .h2ish {
      margin:0 0 8px;
      font-size:1.05rem;
      font-weight:800;
      border-bottom:1px solid var(--border);
      padding-bottom:6px;
    }

    .list {
      margin:0; padding:0; list-style:none;
      border:1px solid var(--border);
      border-radius:6px;
      overflow:hidden;
    }
    .list > li {
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      display:grid;
      grid-template-columns: minmax(220px, 320px) 1fr;
      gap:12px;
    }
    .list > li:last-child { border-bottom:none; }

    .badge {
      display:inline-block;
      border:1px solid var(--border);
      border-radius:999px;
      padding:2px 8px;
      font-size:12px;
      color:var(--muted);
    }

    .grid-2 {
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 740px) {
      .grid-2 { grid-template-columns: 1fr; }
      .kv { grid-template-columns: 1fr; }
      .list > li { grid-template-columns: 1fr; }
    }

    footer.key-footer {
      position:fixed; bottom:0; left:0; right:0;
      padding:8px 12px;
      background:var(--panel-bg);
      border-top:1px solid var(--border);
      display:flex; justify-content:flex-end; gap:8px;
    }

    .hidden { display:none !important; }
    .loading { color:var(--muted); font-style:italic; }
    .error { color:#b00020; font-weight:700; }
  </style>
</head>

<body>

  <!-- Tabs -->
  <nav class="tabs" aria-label="Company sections">
    <a class="tab" id="overviewTab" aria-current="page">Overview</a>
    <a class="tab" id="filingTab" target="_blank">Filing history</a>
    <a class="tab" id="peopleTab">People</a>
    <a class="tab" id="dapdTab">DAPD Est.</a>
    <a class="tab" id="moreTab" target="_blank">More</a>
  </nav>

  <main>
    <!-- OVERVIEW -->
    <section id="overviewPanel" class="panel">
      <div id="overviewBody">
        <span class="muted">Loading…</span>
      </div>
    </section>

    <!-- PEOPLE (internal) -->
    <section id="peoplePanel" class="panel hidden" aria-labelledby="peopleTab">
      <h2 class="h2ish">People</h2>
      <div id="peopleBody" class="grid-2">
        <div>
          <h3 class="h2ish" style="font-size:1rem;">Active officers</h3>
          <div id="peopleActive"><span class="loading">—</span></div>
        </div>
        <div>
          <h3 class="h2ish" style="font-size:1rem;">Resigned officers</h3>
          <div id="peopleResigned"><span class="loading">—</span></div>
        </div>
      </div>
    </section>


    <!-- DAPD EST. (internal) -->
    <section id="dapdPanel" class="panel hidden" aria-labelledby="dapdTab">
      <h2 class="h2ish">Derived Accounting Period Display (Estimated)</h2>
      <div id="dapdBody"><span class="loading">—</span></div>
    </section>


    <!-- INSOLVENCY (conditionally created + shown when available) -->
    <section id="insolvencyPanel" class="panel hidden" aria-labelledby="insolvencyTab">
      <h2 class="h2ish">Insolvency</h2>
      <div id="insolvencyBody"><span class="loading">—</span></div>
    </section>

    <p id="error" class="error"></p>
  </main>

<script>
  /* ================= Utilities ================= */

  /* 🔧 UPDATED — API key now comes from the URL */

  function parseRoute() {
    const path = decodeURIComponent(location.search)
    const parts = path.split('/');
    return {
      number : parts[1] || "",
      theme  : parts[2] || "auto",
      key    : parts[3] || ""
    };
  }

  function applyTheme(mode) {
    const root = document.documentElement;
    if (mode === "dark") root.setAttribute("data-theme","dark");
    else if (mode === "light") root.setAttribute("data-theme","light");
    else root.setAttribute("data-theme","auto");
  }

  async function chGet(path, key) {
    if (!key) throw new Error("No API key found in URL.");
    const res = await fetch("https://api.company-information.service.gov.uk" + path, {
      headers: { "Authorization": "Basic " + btoa(key + ":") }
    });
    if (!res.ok) throw new Error(res.status + " " + res.statusText + " — " + path);
    return res.json();
  }

  function setActiveTab(tabEl, panelEl) {
    // Update aria-current
    for (const t of document.querySelectorAll('.tab')) {
      if (t === tabEl) t.setAttribute('aria-current','page');
      else t.removeAttribute('aria-current');
    }
    // Show/hide panels
    for (const s of [ '#overviewPanel', '#peoplePanel', '#insolvencyPanel' ]) {
      const el = document.querySelector(s);
      if (!el) continue;
      if (el === panelEl) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }
  }

  function safe(txt) {
    if (txt === null || txt === undefined) return "";
    return String(txt)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;');
  }

  function formatDate(d) {
    return d ? d : "—";
  }

/* ================= Feature: DAPD Est. ================= */

  let dapdLoaded = false;

  async function loadDAPD(number, key) {
    const mount = document.querySelector('#dapdBody');
    mount.innerHTML = '<span class="loading">Loading…</span>';

    try {
      const html = await getAccountingPeriodHTML(number, key);
      mount.innerHTML = html;
      dapdLoaded = true;
    } catch (err) {
      mount.innerHTML = `<span class="error">${safe(err.message || 'Unable to build DAPD view')}</span>`;
    }
  }

  /* ================= Feature: People ================= */

  let peopleLoaded = false;

  async function loadPeople(number, key) {
    const activeMount   = document.querySelector('#peopleActive');
    const resignedMount = document.querySelector('#peopleResigned');
    activeMount.innerHTML = '<span class="loading">Loading…</span>';
    resignedMount.innerHTML = '<span class="loading">Loading…</span>';

    try {
      const data = await chGet(`/company/${number}/officers?items_per_page=50`, key);
      const items = Array.isArray(data.items) ? data.items : [];

      const active = items.filter(i => !i.resigned_on);
      const resig  = items.filter(i =>  i.resigned_on);

      function renderList(list) {
        if (!list.length) return '<p class="muted">No entries.</p>';
        return `
          <ul class="list">
            ${list.map(i => `
              <li>
                <div>
                  <div style="font-weight:700;">${safe(i.name || '—')}</div>
                  <div class="muted">
                    <span class="badge">${safe(i.officer_role || 'officer')}</span>
                    ${i.occupation ? ` · ${safe(i.occupation)}` : ""}
                  </div>
                </div>
                <div>
                  <div class="kv"><div class="muted">Appointed: </div><div>${formatDate(i.appointed_on)}</div></div>
                  ${i.resigned_on ? `<div class="kv"><div class="muted">Resigned: </div><div>${formatDate(i.resigned_on)}</div></div>` : ""}
                </div>
              </li>
            `).join('')}
          </ul>
        `;
      }

      activeMount.innerHTML   = renderList(active);
      resignedMount.innerHTML = renderList(resig);
      peopleLoaded = true;
    } catch (err) {
      activeMount.innerHTML = `<span class="error">${safe(err.message)}</span>`;
      resignedMount.innerHTML = '';
    }
  }

  /* ================= Feature: Insolvency ================= */

  let insolvencyLoaded = false;

  async function loadInsolvency(number, key) {
    const mount = document.querySelector('#insolvencyBody');
    mount.innerHTML = '<span class="loading">Loading…</span>';

    try {
      const data = await chGet(`/company/${number}/insolvency`, key);

      const cases = Array.isArray(data.cases) ? data.cases : [];
      if (!cases.length) {
        mount.innerHTML = '<p class="muted">No insolvency cases found.</p>';
        return;
      }

      function renderPractitioners(pracs) {
        if (!Array.isArray(pracs) || !pracs.length) return '<p class="muted" style="margin:0;">No practitioners listed.</p>';
        return `
          <ul class="list">
            ${pracs.map(p => `
              <li>
                <div style="font-weight:700;">${safe(p.name || '—')}</div>
                <div>
                  ${p.address ? `<div class="kv"><div class="muted">Address: </div><div>${safe(Object.values(p.address).filter(Boolean).join(", "))}</div></div>` : ""}
                  ${p.ip_number ? `<div class="kv"><div class="muted">IP number: </div><div>${safe(p.ip_number)}</div></div>` : ""}
                  ${p.appointed_on ? `<div class="kv"><div class="muted">Appointed on: </div><div>${safe(p.appointed_on)}</div></div>` : ""}
                </div>
              </li>
            `).join('')}
          </ul>
        `;
      }

      mount.innerHTML = cases.map(c => `
        <section class="panel" style="margin-top:12px;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
            <span class="badge">${safe(c.case_type || 'case')}</span>
            ${c.status ? `<span class="badge" title="Status">${safe(c.status)}</span>` : ""}
            ${c.case_number ? `<span class="badge" title="Case number">#${safe(c.case_number)}</span>` : ""}
          </div>

          ${c.notes ? `<p class="muted" style="margin:6px 0 8px;">${safe(c.notes)}</p>` : ''}

          <div class="grid-2">
            <div>
              <h3 class="h2ish" style="font-size:1rem;">Timeline</h3>
              <div>
                ${c.dates && c.dates.length ? c.dates.map(d => `
                  <div class="kv"><div class="muted">${safe(d.type || 'Event')}</div><div>${formatDate(d.date)}</div></div>
                `).join('') : '<p class="muted" style="margin:0;">No timeline available.</p>'}
              </div>
            </div>
            <div>
              <h3 class="h2ish" style="font-size:1rem;">Practitioners</h3>
              ${renderPractitioners(c.practitioners)}
            </div>
          </div>
        </section>
      `).join('');
      insolvencyLoaded = true;

    } catch (err) {
      mount.innerHTML = `<span class="error">${safe(err.message)}</span>`;
    }
  }

  
  // -----------------------------------
  // DAPD (Derived Accounting Period Display) — core helpers
  // -----------------------------------
  async function getCompanyAccountsFilings(companyNumber, key) {
    const path = `/company/${companyNumber}/filing-history?items_per_page=200`;
    const data = await chGet(path, key);
    if (!data.items) return [];
    return data.items.filter(item => item.category === "accounts");
  }

  // Parse an ISO date (YYYY-MM-DD) into a Date
  function toDate(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  // Format Date -> DD/MM/YYYY without clobbering your other UI formatter
  function formatDateGB(d) {
    return d instanceof Date && !Number.isNaN(d.valueOf())
      ? d.toLocaleDateString("en-GB")
      : "—";
  }
  
  function buildAccountingPeriods(accounts) {
  
    // First extract: true start/end, dormant
    const extracted = accounts
      .map(f => {
        const end = getTruePeriodEnd(f);
        let start;
  
        if (f.description_values?.period_start_on) {
          start = toDate(f.description_values.period_start_on);
        } else {
          // Infer 12-month period if start is missing
          start = new Date(end);
          start.setFullYear(start.getFullYear() - 1);
          start.setDate(start.getDate() + 1);
        }
  
        const isDormant =
          /dormant/i.test(f.description || "") ||
          /dormant/i.test(f.type || "");
  
        return { start, end, dormant: isDormant };
      })
      .sort((a, b) => a.end - b.end);  // IMPORTANT: sort by TRUE end dates
  
  
    const periods = [];
  
    for (const entry of extracted) {
      const { start, end, dormant } = entry;
  
      // Duration
      const days = Math.round((end - start) / 86400000);
  
      // -------------- SHORTENED period (< 11 months) ----------------
      if (days < 335) {
        periods.push({ start, end, dormant });
        continue;
      }
  
      // -------------- NORMAL period (≈ 12 months) ----------------
      if (days <= 366) {
        periods.push({ start, end, dormant });
        continue;
      }
  
      // -------------- EXTENDED period (> 12 months) ----------------
      // First 12-month period
      const firstEnd = new Date(start);
      firstEnd.setFullYear(firstEnd.getFullYear() + 1);
      firstEnd.setDate(firstEnd.getDate() - 1);
  
      periods.push({ start, end: firstEnd, dormant });
  
      // Stub period (remaining)
      const stubStart = new Date(firstEnd);
      stubStart.setDate(stubStart.getDate() + 1);
  
      periods.push({ start: stubStart, end, dormant });
    }
  
    // -------------- ENSURE PERIODS ARE SEQUENTIAL ----------------
    for (let i = 1; i < periods.length; i++) {
      const prev = periods[i - 1];
      const curr = periods[i];
  
      const expectedStart = new Date(prev.end);
      expectedStart.setDate(expectedStart.getDate() + 1);
  
      if (curr.start.getTime() !== expectedStart.getTime()) {
        // Fix the start to ensure continuity
        const duration = Math.round((curr.end - curr.start) / 86400000);
        curr.start = expectedStart;
  
        // Maintain the period length
        const correctedEnd = new Date(expectedStart);
        correctedEnd.setDate(correctedEnd.getDate() + duration);
        curr.end = correctedEnd;
      }
    }
  
    // Remove anything pre‑2010
    return periods.filter(p => p.end.getFullYear() >= 2010);
  }
  
  // Extend with future 12‑month periods until a target end year (inclusive)
  function addFuturePeriodsUntilYear(periods, targetYearEnd = 2028) {
    if (!periods.length) return periods;

    let lastEnd = periods[periods.length - 1].end;
    while (lastEnd.getFullYear() < targetYearEnd) {
      const nextStart = new Date(lastEnd);
      nextStart.setDate(nextStart.getDate() + 1);

      const nextEnd = new Date(nextStart);
      nextEnd.setFullYear(nextEnd.getFullYear() + 1);
      nextEnd.setDate(nextEnd.getDate() - 1);

      periods.push({ start: nextStart, end: nextEnd, dormant: false });
      lastEnd = nextEnd;
    }
    return periods;
  }

  // Render a compact table like your sample
  function periodsToHTML(periods) {
    const rows = periods.map(p => `
      <tr>
        <td style="background: yellow;">${formatDateGB(p.start)}</td>
        <td style="background: yellow;">${formatDateGB(p.end)}</td>
        <td style="background: yellow;">${p.dormant ? "D" : "L"}</td>
      </tr>
    `).join("");

    return `
      <h3 class="h2ish" style="font-size:1rem;">CURRENT DETAILS</h3>
      <table border="1" cellpadding="6" style="border-collapse: collapse; font-family: Arial;">
        <tr style="background: #e0e0ff; font-weight: bold;">
          <td>Start Date</td>
          <td>End Date</td>
          <td>Status</td>
        </tr>
        ${rows || `<tr><td colspan="3" class="muted">No accounting periods found.</td></tr>`}
      </table>
    `;
  }

  // Build DAPD HTML (with fallback if filing-history is unavailable/empty)
  async function getAccountingPeriodHTML(companyNumber, key) {
    // Try filing history first
    const filings = await getCompanyAccountsFilings(companyNumber, key);
    let periods = buildAccountingPeriods(filings);

    // Fallback: if nothing returned (e.g., new company), estimate from /company profile
    if (!periods.length) {
      try {
        const profile = await chGet(`/company/${companyNumber}`, key);
        const acc = profile?.accounts || {};
        const last = acc.last_accounts || {};
        const next = acc.next_accounts || {};

        const seed = [];

        if (last.period_start_on && last.period_end_on) {
          seed.push({
            start: toDate(last.period_start_on),
            end: toDate(last.period_end_on),
            dormant: /dormant/i.test(last.type || "")
          });
        } else if (last.made_up_to) {
          const end = toDate(last.made_up_to);
          const start = new Date(end);
          start.setFullYear(start.getFullYear() - 1);
          start.setDate(start.getDate() + 1);
          seed.push({ start, end, dormant: /dormant/i.test(last.type || "") });
        }

        if (next.period_start_on && next.period_end_on) {
          seed.push({
            start: toDate(next.period_start_on),
            end: toDate(next.period_end_on),
            dormant: false
          });
        }

        if (seed.length) periods = buildAccountingPeriods(seed);
      } catch (_) {
        // ignore fallback errors; UI will show “No accounting periods found.”
      }
    }

    // Predict through 2028 as requested
    addFuturePeriodsUntilYear(periods, 2028);

    return periodsToHTML(periods);
  }

  /* ================= Overview + Tabs wiring ================= */

  async function loadOverviewFromUrl() {
    const { number, theme, key } = parseRoute();
    applyTheme(theme);

    if (!number) {
      document.querySelector("#overviewBody").innerHTML =
        "<span class='muted'>Add /company/theme/apikey to URL</span>";
      return;
    }

    try {
      const profile = await chGet(`/company/${number}`, key);

      // External tabs for filing
      const chBase = `https://find-and-update.company-information.service.gov.uk/company/${profile.company_number}`;
      document.querySelector("#filingTab").href = `${chBase}/filing-history`;
      document.querySelector("#moreTab").href   = chBase;

      // Overview body (compact kv rows with borders)
      document.querySelector("#overviewBody").innerHTML = `
        <div class="kv"><span class="muted">Name: </span><span>${safe(profile.company_name)}</span></div>
        <div class="kv"><span class="muted">Status: </span><span>${safe(profile.company_status)}</span></div>
        <div class="kv"><span class="muted">Type: </span><span>${safe(profile.type)}</span></div>
        <div class="kv"><span class="muted">Incorporated: </span><span>${safe(profile.date_of_creation)}</span></div>
        ${profile.registered_office_address ? `
        <div class="kv"><span class="muted">Registered office: </span><span>${safe(Object.values(profile.registered_office_address).filter(Boolean).join(", "))}</span></div>
        ` : ``}
      `;

      // Tabs behaviour
      const overviewTab = document.querySelector('#overviewTab');
      const peopleTab   = document.querySelector('#peopleTab');
      const dapdTab     = document.querySelector('#dapdTab');

      overviewTab.addEventListener('click', (e) => {
        e.preventDefault();
        setActiveTab(overviewTab, document.querySelector('#overviewPanel'));
      });

      peopleTab.addEventListener('click', async (e) => {
        e.preventDefault();
        setActiveTab(peopleTab, document.querySelector('#peoplePanel'));
        if (!peopleLoaded) await loadPeople(profile.company_number, key);
      });

      dapdTab.addEventListener('click', async (e) => {
        e.preventDefault();
        setActiveTab(dapdTab, document.querySelector('#dapdPanel'));
        if (!dapdLoaded) await loadDAPD(profile.company_number, key);
      });


      // Conditionally add Insolvency tab
      const looksInsolvent = !!profile.has_insolvency_history ||
        (typeof profile.company_status === 'string' && /liquidation|insolvency|insolvent|administration|receivership/i.test(profile.company_status));

      if (looksInsolvent) {
        let insTab = document.querySelector('#insolvencyTab');
        if (!insTab) {
          insTab = document.createElement('a');
          insTab.className = 'tab';
          insTab.id = 'insolvencyTab';
          insTab.textContent = 'Insolvency';
          document.querySelector('.tabs').insertBefore(insTab, document.querySelector('#moreTab'));
        }
        insTab.addEventListener('click', async (e) => {
          e.preventDefault();
          setActiveTab(insTab, document.querySelector('#insolvencyPanel'));
          if (!insolvencyLoaded) await loadInsolvency(profile.company_number, key);
        });
      } else {
        // If no insolvency, ensure panel is hidden
        document.querySelector('#insolvencyPanel').classList.add('hidden');
      }

      // Default to Overview active
      setActiveTab(overviewTab, document.querySelector('#overviewPanel'));

    } catch (err) {
      document.querySelector("#error").textContent = err.message;
      document.querySelector("#overviewBody").innerHTML =
        "<span class='muted'>No data.</span>";
    }
  }

  loadOverviewFromUrl();
</script>

</body>
</html>
