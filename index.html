<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Companies House — Overview</title>

  <style>
    /* (Styles unchanged except header removed; tabs moved up) */

    body { margin:0; font-family:system-ui,-apple-system,Segoe UI; }
    main { padding:24px 18px 96px; max-width:1100px; margin:auto; }

    .tabs {
      display:flex;
      gap:8px;
      border-bottom:1px solid #ccc;
      padding:12px 18px;
      background:#f0f0f0;
      position:sticky;
      top:0;
      z-index:10;
    }
    .tab {
      padding:8px 12px;
      border-radius:6px 6px 0 0;
      background:#e5e5e5;
      text-decoration:none;
      font-weight:700;
      color:#111;
    }
    .tab[aria-current="page"] {
      background:#fff;
      border-bottom:2px solid #0a7f46;
    }

    .panel { background:#fff; border-radius:10px; padding:16px; margin-top:24px; }

    .kv { display:grid; grid-template-columns:220px 1fr; padding:6px 0; }

    .muted { color:#666; }

    footer.key-footer {
      position:fixed; bottom:0; left:0; right:0;
      padding:8px 12px;
      background:#fff;
      border-top:1px solid #ddd;
      display:flex; justify-content:flex-end; gap:8px;
    }
  </style>
</head>

<body>

  <!-- 🔧 UPDATED — Tabs moved above everything -->
  <nav class="tabs" aria-label="Company sections">
    <a class="tab" aria-current="page">Overview</a>
    <a class="tab" id="filingTab" target="_blank">Filing history</a>
    <a class="tab" id="peopleTab" target="_blank">People</a>
    <a class="tab" id="moreTab" target="_blank">More</a>
  </nav>

  <main>

    <!-- 🔧 UPDATED — Company name + number moved HERE into overview panel -->
    <section class="panel">
      <h1 id="companyName">—</h1>
      <p id="companyNumberLine" class="muted">Company number —</p>

      <div id="overviewBody">
        <span class="muted">Loading…</span>
      </div>
    </section>

    <p id="error" style="color:#b00020;font-weight:bold;"></p>

  </main>

  <!-- 🔧 UPDATED — API key is no longer set manually -->
  <footer class="key-footer">
    <span class="muted" id="keyStatus">API key read from URL.</span>
  </footer>

<script>

  /* 🔧 UPDATED — API key now comes from the URL */

  function parseRoute() {
    const parts = location.pathname.replace(/^\/+/, '').split('/').filter(Boolean);
    return {
      number : parts[0] || "",
      theme  : parts[1] || "auto",
      key    : parts[2] || ""      // <-- API KEY FROM URL
    };
  }

  function applyTheme(mode) {
    const root = document.documentElement;
    if (mode === "dark") root.setAttribute("data-theme","dark");
    else if (mode === "light") root.setAttribute("data-theme","light");
    else root.setAttribute("data-theme","auto");
  }

  async function chGet(path, key) {
    if (!key) throw new Error("No API key found in URL.");
    const res = await fetch("https://api.company-information.service.gov.uk" + path, {
      headers: { "Authorization": "Basic " + btoa(key + ":") }
    });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    return res.json();
  }

  async function loadOverviewFromUrl() {
    const { number, theme, key } = parseRoute();

    applyTheme(theme);

    if (!number) {
      document.querySelector("#overviewBody").innerHTML =
        "<span class='muted'>Add /company/theme/apikey to URL</span>";
      return;
    }

    try {
      const profile = await chGet(`/company/${number}`, key);

      document.querySelector("#companyName").textContent = profile.company_name;
      document.querySelector("#companyNumberLine").innerHTML =
        `Company number <strong>${profile.company_number}</strong>`;

      const chBase = `https://find-and-update.company-information.service.gov.uk/company/${profile.company_number}`;
      document.querySelector("#filingTab").href = `${chBase}/filing-history`;
      document.querySelector("#peopleTab").href = `${chBase}/officers`;
      document.querySelector("#moreTab").href   = chBase;

      document.querySelector("#overviewBody").innerHTML = `
        <div class="kv"><div class="muted">Status</div><div>${profile.company_status}</div></div>
        <div class="kv"><div class="muted">Type</div><div>${profile.type}</div></div>
        <div class="kv"><div class="muted">Incorporated</div><div>${profile.date_of_creation}</div></div>
      `;

    } catch (err) {
      document.querySelector("#error").textContent = err.message;
      document.querySelector("#overviewBody").innerHTML =
        "<span class='muted'>No data.</span>";
    }
  }

  loadOverviewFromUrl();

</script>

</body>
</html>
