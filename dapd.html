<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Corporation Tax Accounting Period Generator</title>
<style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { padding: 8px; font-size: 14px; width: 320px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 15px; }
    table { margin-top: 30px; border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .error { color: red; margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<h1>Corporation Tax Accounting Period Generator</h1>

<label>Companies House API Key:</label>
<input id="apiKey" type="text" placeholder="Enter API key">

<label>Company Number:</label>
<input id="companyNumber" type="text" placeholder="e.g. 01234567">

<button onclick="runTool()">Generate Accounting Periods</button>

<div id="error" class="error"></div>
<div id="results"></div>


<script>
/* -----------------------------  
   Companies House API helper  
-------------------------------- */
async function chGet(path, key) {
    const res = await fetch("https://api.company-information.service.gov.uk" + path, {
        headers: { "Authorization": "Basic " + btoa(key + ":") }
    });
    if (!res.ok) throw new Error(res.status + " " + res.statusText + " — " + path);
    return res.json();
}

/* -----------------------------  
   Date utilities  
-------------------------------- */
function addMonths(dt, months) {
    const d = new Date(dt);
    const y = d.getFullYear();
    const m = d.getMonth();
    const day = d.getDate();

    const target = new Date(y, m + months, 1);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(day, last));
    return target;
}

function endAfterMonthsInclusive(start, months) {
    const nextStart = addMonths(start, months);
    return new Date(nextStart.getFullYear(), nextStart.getMonth(), nextStart.getDate() - 1);
}

const d = s => new Date(s);
const fmt = dt => dt.toISOString().substring(0, 10);
const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate() + n); return x; };

function diffMonths(a, b) {
    const years = b.getFullYear() - a.getFullYear();
    const months = b.getMonth() - a.getMonth();
    let total = years * 12 + months;
    if (b.getDate() < a.getDate()) total -= 1;
    return total;
}

/* -----------------------------  
   Description parsing patterns  
-------------------------------- */
const dormantKeywords = ["dormant"];

const madeUpPatterns = [
    "accounts made up to",
    "micro company accounts made up to",
    "total exemption small company accounts made up to",
    "total exemption full accounts made up to",
    "abridged accounts made up to",
    "full accounts made up to",
    "unaudited abridged accounts made up to",
    "group accounts made up to"
];

const shortenedPattern = /accounting period shortened from (.*) to (.*)/i;
const extendedPattern = /accounting period extended from (.*) to (.*)/i;

/* -----------------------------  
   Extract account events  
-------------------------------- */
function extractAccountEvents(filings) {
    const raw = [];

    for (const f of filings) {
        const desc = f.description.toLowerCase();
        const isDormant = dormantKeywords.some(k => desc.includes(k));

        const shortMatch = desc.match(shortenedPattern);
        if (shortMatch) {
            raw.push({
                type: "shortened",
                from: shortMatch[1].trim(),
                to: shortMatch[2].trim(),
                isDormant
            });
            continue;
        }

        const extMatch = desc.match(extendedPattern);
        if (extMatch) {
            raw.push({
                type: "extended",
                from: extMatch[1].trim(),
                to: extMatch[2].trim(),
                isDormant
            });
            continue;
        }

        for (const p of madeUpPatterns) {
            if (desc.includes(p)) {
                const dates = desc.match(/\d{1,2} \w+ \d{4}/g);
                if (dates && dates.length) {
                    const end = new Date(dates.pop());
                    raw.push({
                        type: "made_up_to",
                        end,
                        isDormant
                    });
                }
                break;
            }
        }
    }

    const dedup = new Map();
    const others = [];

    for (const e of raw) {
        if (e.type === "made_up_to") {
            dedup.set(fmt(e.end), e);
        } else {
            others.push(e);
        }
    }

    const sorted = [...dedup.values(), ...others].sort((a, b) => {
        const aEnd = a.end ?? new Date(a.to);
        const bEnd = b.end ?? new Date(b.to);
        return aEnd - bEnd;
    });

    return sorted;
}

/* -----------------------------  
   Build CTAP chain  
-------------------------------- */
function buildCTAPs(incorpDate, events) {
    const periods = [];

    let prevStart = d(incorpDate);
    let prevEnd = null;

    for (const e of events) {
        if (e.type === "made_up_to") {
            const end = e.end;
            const status = e.isDormant ? "D" : "L";

            const start = prevEnd ? addDays(prevEnd, 1) : prevStart;
            const months = diffMonths(start, end);

            if (months > 12) {
                if (months > 18) throw new Error("Filing indicates accounting period >18 months.");

                const twelveEnd = endAfterMonthsInclusive(start, 12);

                periods.push({ start, end: twelveEnd, status });
                periods.push({ start: addDays(twelveEnd, 1), end, status });

                prevEnd = end;
                continue;
            }

            periods.push({ start, end, status });
            prevEnd = end;
        }

        else if (e.type === "shortened") {
            const start = prevEnd ? addDays(prevEnd, 1) : prevStart;
            const end = d(e.to);
            const status = e.isDormant ? "D" : "L";
            periods.push({ start, end, status });
            prevEnd = end;
        }

        else if (e.type === "extended") {
            const start = prevEnd ? addDays(prevEnd, 1) : prevStart;
            const end = d(e.to);
            const months = diffMonths(start, end);

            if (months > 18) throw new Error("Extended period exceeds 18 months.");

            if (months > 12) {
                const twelveEnd = endAfterMonthsInclusive(start, 12);
                periods.push({ start, end: twelveEnd, status: "L" });
                periods.push({ start: addDays(twelveEnd, 1), end, status: "L" });
            } else {
                periods.push({ start, end, status: "L" });
            }

            prevEnd = end;
        }
    }

    /* Add future annual periods to 2028 */
    let nextStart = prevEnd ? addDays(prevEnd, 1) : d(incorpDate);

    while (nextStart.getFullYear() <= 2028) {
        const nextEnd = endAfterMonthsInclusive(nextStart, 12);
        periods.push({ start: nextStart, end: nextEnd, status: "L" });
        nextStart = addDays(nextEnd, 1);
    }

    return periods;
}

/* -----------------------------  
   Main tool runner  
-------------------------------- */
async function runTool() {
    const key = document.getElementById("apiKey").value.trim();
    const num = document.getElementById("companyNumber").value.trim();

    document.getElementById("error").innerText = "";
    document.getElementById("results").innerHTML = "";

    try {
        const profile = await chGet(`/company/${num}`, key);
        const incorp = profile.date_of_creation;

        const filings = await chGet(`/company/${num}/filing-history?items_per_page=200`, key);
        const accountsFilings = filings.items.filter(i => i.category === "accounts");

        const events = extractAccountEvents(accountsFilings);
        const ctaps = buildCTAPs(incorp, events);

        let html = `<table>
            <tr><th>AP Start</th><th>AP End</th><th>Status</th></tr>`;

        for (const p of ctaps) {
            html += `<tr>
                <td>${fmt(p.start)}</td>
                <td>${fmt(p.end)}</td>
                <td>${p.status}</td>
            </tr>`;
        }

        html += "</table>";
        document.getElementById("results").innerHTML = html;
    }
    catch (err) {
        document.getElementById("error").innerText = err.message;
    }
}
</script>

</body>
</html>
