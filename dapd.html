<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Corporation Tax Accounting Period Generator</title>
<style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { padding: 8px; font-size: 14px; width: 320px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
    table { margin-top: 30px; border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .error { color: red; margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<h1>Corporation Tax Accounting Period Generator</h1>

<label>Companies House API Key:</label>
<input id="apiKey" type="text" placeholder="Enter API key">

<label>Company Number:</label>
<input id="companyNumber" type="text" placeholder="e.g. 01234567">

<button onclick="runTool()">Generate Accounting Periods</button>

<div id="error" class="error"></div>
<div id="results"></div>


<script>
/* ------------------------------------------------------------
   Companies House Fetch Helper
------------------------------------------------------------- */
async function chGet(path, key) {
    const res = await fetch("https://api.company-information.service.gov.uk" + path, {
        headers: { "Authorization": "Basic " + btoa(key + ":") }
    });
    if (!res.ok) throw new Error(res.status + " " + res.statusText + " — " + path);
    return res.json();
}

/* ------------------------------------------------------------
   DATE HELPERS
------------------------------------------------------------- */
function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
}

function addMonths(date, months) {
    const d = new Date(date);
    const target = new Date(d.getFullYear(), d.getMonth() + months, 1);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(d.getDate(), last));
    return target;
}

// Return end date for a CTAP that is `months` long (inclusive)
function endAfterMonthsInclusive(start, months) {
    const nextStart = addMonths(start, months);
    return new Date(nextStart.getFullYear(), nextStart.getMonth(), nextStart.getDate() - 1);
}

const d = (s) => new Date(s);
const fmt = (dt) => dt.toISOString().substring(0, 10);

/* ------------------------------------------------------------
   FILING PARSING PATTERNS
------------------------------------------------------------- */
const dormantKeywords = ["dormant"];
const madeUpPatterns = [
    "accounts made up to",
    "micro company accounts made up to",
    "total exemption small company accounts made up to",
    "total exemption full accounts made up to",
    "abridged accounts made up to",
    "full accounts made up to",
    "unaudited abridged accounts made up to",
    "group accounts made up to"
];

const shortenedPattern = /accounting period shortened from (.*) to (.*)/i;
const extendedPattern = /accounting period extended from (.*) to (.*)/i;

/* ------------------------------------------------------------
   Extract account events from filings
------------------------------------------------------------- */
function extractAccountEvents(filings) {
    const raw = [];

    for (const f of filings) {
        const desc = f.description.toLowerCase();
        const isDormant = dormantKeywords.some(k => desc.includes(k));

        const shortMatch = desc.match(shortenedPattern);
        if (shortMatch) {
            raw.push({
                type: "shortened",
                from: shortMatch[1].trim(),
                to: shortMatch[2].trim(),
                isDormant
            });
            continue;
        }

        const extMatch = desc.match(extendedPattern);
        if (extMatch) {
            raw.push({
                type: "extended",
                from: extMatch[1].trim(),
                to: extMatch[2].trim(),
                isDormant
            });
            continue;
        }

        for (const p of madeUpPatterns) {
            if (desc.includes(p)) {
                const dates = desc.match(/\d{1,2} \w+ \d{4}/g);
                if (dates && dates.length) {
                    const end = new Date(dates.pop());
                    raw.push({
                        type: "made_up_to",
                        end,
                        isDormant
                    });
                }
                break;
            }
        }
    }

    // Deduplicate by end date
    const dedup = new Map();
    const others = [];

    for (const e of raw) {
        if (e.type === "made_up_to") {
            dedup.set(fmt(e.end), e);
        } else {
            others.push(e);
        }
    }

    return [...dedup.values(), ...others].sort((a, b) => {
        const aEnd = a.end ?? new Date(a.to);
        const bEnd = b.end ?? new Date(b.to);
        return aEnd - bEnd;
    });
}

/* ------------------------------------------------------------
   BUILD CTAP PERIODS
------------------------------------------------------------- */
function buildCTAPs(incorpDate, events) {
    const periods = [];

    if (events.length === 0)
        throw new Error("No account filings found – cannot determine CTAP structure.");

    // FIRST ACCOUNTS EVENT
    const firstEvent = events.find(e => e.type === "made_up_to");
    if (!firstEvent) throw new Error("No 'made up to' accounts found.");

    const firstMadeUpTo = firstEvent.end;

    // 1) FIRST 12‑MONTH PERIOD
    const first12End = endAfterMonthsInclusive(incorpDate, 12);

    if (first12End < firstMadeUpTo) {
        // Split required
        periods.push({
            start: incorpDate,
            end: first12End,
            status: firstEvent.isDormant ? "D" : "L"
        });

        periods.push({
            start: addDays(first12End, 1),
            end: firstMadeUpTo,
            status: firstEvent.isDormant ? "D" : "L"
        });
    } else {
        // Single period only
        periods.push({
            start: incorpDate,
            end: firstMadeUpTo,
            status: firstEvent.isDormant ? "D" : "L"
        });
    }

    // YEAR-END PATTERN FROM FIRST ACCOUNTS
    const yearEndMonth = firstMadeUpTo.getMonth(); // usually 11 for December
    const yearEndDay = firstMadeUpTo.getDate();    // usually 31

    let lastEnd = firstMadeUpTo;

    // 2) GENERATE FUTURE ANNUAL CTAPs TO 2028
    while (lastEnd.getFullYear() < 2028) {
        const nextStart = addDays(lastEnd, 1);
        const nextEnd = new Date(nextStart.getFullYear(), yearEndMonth, yearEndDay);

        periods.push({
            start: nextStart,
            end: nextEnd,
            status: "L"
        });

        lastEnd = nextEnd;
    }

    return periods;
}

/* ------------------------------------------------------------
   MAIN EXECUTION
------------------------------------------------------------- */
async function runTool() {
    const key = document.getElementById("apiKey").value.trim();
    const num = document.getElementById("companyNumber").value.trim();

    document.getElementById("error").innerText = "";
    document.getElementById("results").innerHTML = "";

    try {
        const profile = await chGet(`/company/${num}`, key);
        const incorp = d(profile.date_of_creation);

        const filings = await chGet(`/company/${num}/filing-history?items_per_page=200`, key);
        const accountsFilings = filings.items.filter(i => i.category === "accounts");

        const events = extractAccountEvents(accountsFilings);
        const ctaps = buildCTAPs(incorp, events);

        let html = `<table>
            <tr><th>AP Start</th><th>AP End</th><th>Status</th></tr>`;

        for (const p of ctaps) {
            html += `<tr>
                <td>${fmt(p.start)}</td>
                <td>${fmt(p.end)}</td>
                <td>${p.status}</td>
            </tr>`;
        }

        html += "</table>";
        document.getElementById("results").innerHTML = html;
    }
    catch (err) {
        document.getElementById("error").innerText = err.message;
    }
}
</script>

</body>
</html>
